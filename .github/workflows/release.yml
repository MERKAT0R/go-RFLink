name: release

# Triggers only when a tag matching v* is pushed, e.g.:
#   git tag -a v1.3.0 -m "v1.3.0"
#   git push origin v1.3.0
# (git push without the tag name does NOT push tags)
on:
  push:
    tags:
      - "v*"
  # Manual re-run for an existing tag (Actions → release → Run workflow)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.3.0); leave empty to use github.ref"
        required: false
        default: ""

permissions:
  contents: write   # GitHub Releases + assets
  packages: write   # GHCR push
  id-token: write   # optional provenance

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # For workflow_dispatch with explicit tag, check out that tag
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
