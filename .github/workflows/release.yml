name: release

# Triggers only when a tag matching v* is pushed, e.g.:
#   git tag -a v1.3.0 -m "v1.3.0"
#   git push origin v1.3.0
# (git push without the tag name does NOT push tags)
on:
  push:
    tags:
      - "v*"
  # Manual re-run for an existing tag (Actions → release → Run workflow)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.3.0); leave empty to use github.ref"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Releases + assets
      packages: write   # GHCR push
      id-token: write   # optional provenance
    steps:
      - name: Require a v* tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GIT_REF: ${{ github.ref }}
        run: |
          ref="$GIT_REF"
          if [ -n "$INPUT_TAG" ]; then
            ref="$INPUT_TAG"
          fi
          case "$ref" in
            v*) ref="refs/tags/$ref" ;;
          esac
          case "$ref" in
            refs/tags/v*) ;;
            *) echo "refusing non-tag ref" >&2; exit 1 ;;
          esac
          case "$ref" in
            *[!A-Za-z0-9._/-]*) echo "ref contains unsafe characters" >&2; exit 1 ;;
          esac
          echo "RELEASE_REF=$ref" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
