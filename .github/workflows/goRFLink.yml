name: goRFLink

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true

      - name: Verify dependencies
        run: go mod download && go mod verify

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Build
        run: |
          go build -ldflags "-X rflink.Version=${{ github.ref_name }} -X rflink.GitSHA=$(git rev-parse --short HEAD)" -v -o go-rflink .

      - name: Test
        run: go test ./...
