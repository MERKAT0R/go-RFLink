name: goRFLink

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: "30 1 * * 1"
  branch_protection_rule:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true

      - name: Verify dependencies
        run: go mod download && go mod verify

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      # CI artifact only — real release versions come from goreleaser on tag push (release.yml).
      # github.ref_name is the branch (master/main) or PR ref, never a release tag here.
      - name: Build
        run: |
          VERSION="dev"
          case "${{ github.ref }}" in
            refs/tags/v*) VERSION="${{ github.ref_name }}" ;;
            refs/heads/*) VERSION="${{ github.ref_name }}-$(git rev-parse --short HEAD)" ;;
            *) VERSION="ci-$(git rev-parse --short HEAD)" ;;
          esac
          echo "Building with Version=${VERSION}"
          go build -ldflags "-X github.com/MERKAT0R/go-RFLink/rflink.Version=${VERSION} -X github.com/MERKAT0R/go-RFLink/rflink.GitSHA=$(git rev-parse --short HEAD)" -v -o go-rflink .

      - name: Test
        run: go test ./...

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
