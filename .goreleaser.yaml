# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# go-rflink — https://github.com/MERKAT0R/go-RFLink
#
# Local:
#   docker buildx create --name multi --driver docker-container --use
#   docker buildx inspect --bootstrap
#   goreleaser release --snapshot --clean
#
# Release:
#   git tag v1.2.3 && git push origin v1.2.3

version: 2

project_name: go-rflink

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: go-rflink
    main: .
    binary: go-rflink
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X rflink.Version={{.Version}} -X rflink.GitSHA={{.ShortCommit}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - go-rflink
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README.md
      - HTTP.md
      - env.sh.example
      - Dockerfile
      - docker-compose.ghcr.yml
      - docker-compose.yml

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: MERKAT0R
    name: go-RFLink
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
  footer: >-

    ---

    ## Run

    Do not forget to set the _required_ environment variables (see `env.sh.example`).
   
    # Docker
    ```bash
    docker pull ghcr.io/merkat0r/go-rflink:latest
    ```
    # Linux x64 
    ```bash
    tar -xzf go-rflink_0.1.4-082026-beta_Linux_x86_64.tar.gz ./go-rflink
    ```
    # Windows x64
    ```bash
    unzip and run `go-rflink.exe`
    ```
 
    Released with [GoReleaser](https://github.com/goreleaser/goreleaser).

# Multi-arch images via buildx (replaces dockers + docker_manifests).
# Images are built/pushed in the publish phase. Snapshot builds produce
# per-platform tags instead of a manifest.
# Multi-arch requires buildx "docker-container" driver (default "docker" cannot
# build linux/amd64+arm64). One-time local setup:
#   docker buildx create --name multi --driver docker-container --use
#   docker buildx inspect --bootstrap
# CI: use docker/setup-qemu-action + docker/setup-buildx-action before goreleaser.
dockers_v2:
  - ids:
      - go-rflink
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/merkat0r/go-rflink
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
      - "{{ if .IsNightly }}nightly{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.title: go-rflink
      org.opencontainers.image.description: "RFLink serial to MQTT bridge"
      org.opencontainers.image.source: "https://github.com/MERKAT0R/go-RFLink"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
