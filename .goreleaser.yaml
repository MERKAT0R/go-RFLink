# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
#
# go-rflink — https://github.com/MERKAT0R/go-RFLink
# Docs: https://goreleaser.com
#
# Local snapshot (no GitHub publish; Docker tags get platform suffix):
#   goreleaser release --snapshot --clean
#
# Tag release:
#   git tag v1.2.3 && git push origin v1.2.3

version: 2

project_name: go-rflink

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: go-rflink
    main: .
    binary: go-rflink
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X rflink.Version={{ .Version }}
      - -X rflink.GitSHA={{ .ShortCommit }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids: [go-rflink]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md
      - env.sh.example
      - Dockerfile
      - docker-compose.yml

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: MERKAT0R
    name: go-RFLink
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
  footer: >-

    ---

    ## Run

    Do not forget to set the required environment variables (see `env.sh.example`).

    ```bash
    # Linux amd64 example
    tar -xzf go-rflink_{{ .Version }}_Linux_x86_64.tar.gz
    ./go-rflink
    ```

    Windows: unzip and run `go-rflink.exe`.

    Released with [GoReleaser](https://github.com/goreleaser/goreleaser).

# Multi-arch images via buildx (replaces dockers + docker_manifests).
# Images are built/pushed in the publish phase. Snapshot builds produce
# per-platform tags instead of a manifest.
# Multi-arch requires buildx "docker-container" driver (default "docker" cannot
# build linux/amd64+arm64). One-time local setup:
#   docker buildx create --name multi --driver docker-container --use
#   docker buildx inspect --bootstrap
# CI: use docker/setup-qemu-action + docker/setup-buildx-action before goreleaser.
# SBOM/provenance off for broader driver compatibility.
dockers_v2:
  - ids: [go-rflink]
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/merkat0r/go-rflink
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
      - "{{ if .IsNightly }}nightly{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    flags:
      - "--provenance=false"
    labels:
      "org.opencontainers.image.title": "go-rflink"
      "org.opencontainers.image.description": "RFLink serial → MQTT bridge"
      "org.opencontainers.image.source": "https://github.com/MERKAT0R/go-RFLink"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
