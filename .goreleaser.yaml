# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# go-rflink — https://github.com/MERKAT0R/go-RFLink
#
# Local:
#   docker buildx create --name multi --driver docker-container --use
#   docker buildx inspect --bootstrap
#   goreleaser release --snapshot --clean
#
# Release:
#   git tag v0.4.0 && git push origin v0.4.0

version: 2

project_name: go-rflink

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: go-rflink
    main: .
    binary: go-rflink
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/MERKAT0R/go-rflink/rflink.Version={{.Version}} -X github.com/MERKAT0R/go-rflink/rflink.GitSHA={{.ShortCommit}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - go-rflink
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README.md
      - HTTP.md
      - env.sh.example
      - Dockerfile
      - docker-compose.ghcr.yml
      - docker-compose.yml

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: MERKAT0R
    name: go-RFLink
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
  # Literal block: a folded scalar (>-) turns each single newline into a space,
  # so GitHub receives headings and fences on the same line and the notes fall apart.
  footer: |-
    ## What's new since v0.2.1

    - Several RFLink gateways can run together, including a board on the network (`tcp://host:port`). Each gateway then has its own status, and Home Assistant follows the one that received the sensor.
    - A command sent to several gateways is `partial` when only some of them accept it.
    - `/metrics` serves Prometheus counters, and a `.env` file is picked up when it is present.
    - Home Assistant can publish a momentary button as a device trigger, show the switch state echoed by RFLink, and mark a single sensor offline after it goes quiet.
    - MQTT can use a client certificate. Commands are logged with who sent them and how they finished.
    - A Home Assistant add-on and an Unraid template are included. In Docker, set `TZ` (the image default is `Etc/UTC`).
    - Lots of small improvements.

    ## Fixes

    - After a crash, retained serial and health messages expire instead of staying `online`. A clean stop publishes `offline`.
    - Removing a gateway from the configuration clears its old `gateway/info`.
    - The firmware answer to `10;version;` stays in place when a later PONG arrives.
    - Deleting `runtime.json` returns settings to the environment variables.
    - A webhook does not carry your headers to another host after a redirect, and it refuses cloud-metadata addresses.
    - Signing out cannot end a different session.

    ---

    ## Run

    Do not forget to set the _required_ environment variables (see `env.sh.example` and carefully `README.md`).

    ### Docker

    ```bash
    docker pull ghcr.io/merkat0r/go-rflink:latest
    ```

    ### Linux x64

    ```bash
    tar -xzf go-rflink_{{ .Version }}_Linux_x86_64.tar.gz
    ./go-rflink
    ```

    ### Windows x64

    ```powershell
    Expand-Archive go-rflink_{{ .Version }}_Windows_x86_64.zip -DestinationPath .
    .\go-rflink.exe
    ```

    Released with [GoReleaser](https://github.com/goreleaser/goreleaser).

# Multi-arch images via buildx (replaces dockers + docker_manifests).
# Images are built/pushed in the publish phase. Snapshot builds produce
# per-platform tags instead of a manifest.
# Multi-arch requires buildx "docker-container" driver (default "docker" cannot
# build linux/amd64+arm64). One-time local setup:
#   docker buildx create --name multi --driver docker-container --use
#   docker buildx inspect --bootstrap
# CI: use docker/setup-qemu-action + docker/setup-buildx-action before goreleaser.
dockers_v2:
  - ids:
      - go-rflink
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/merkat0r/go-rflink
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
      - "{{ if .IsNightly }}nightly{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.title: go-rflink
      org.opencontainers.image.description: "RFLink serial to MQTT bridge"
      org.opencontainers.image.source: "https://github.com/MERKAT0R/go-RFLink"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
